name: CI Pipeline

on:
  push:
    branches: [ SCRUM-6-User-login-with-email-and-password ]
  pull_request:
    branches: [ SCRUM-6-User-login-with-email-and-password ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build